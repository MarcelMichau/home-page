name: Build Website, Test & Deploy

on: [push]

permissions:
  contents: read

concurrency:
  group: build-test-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.20.0
  PNPM_VERSION: 12.5.1
  WRANGLER_TEST_VERSION: 4.141.0

jobs:
  # Temporary diagnostic matrix: keep Wrangler and the runner image fixed while
  # testing every combination of the last known-good and hanging Node/pnpm versions.
  test-runtime:
    name: Playwright (Node ${{ matrix.node }}, pnpm ${{ matrix.pnpm }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24.20.0
          - 24.21.0
        pnpm:
          - 12.5.1
          - 12.6.0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ matrix.pnpm }}

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        timeout-minutes: 5
        env:
          PLAYWRIGHT_WEB_SERVER_COMMAND: pnpm dlx --allow-build=esbuild --allow-build=workerd wrangler@${{ env.WRANGLER_TEST_VERSION }} pages dev src --port 8788
          WRANGLER_LOG: debug
          WRANGLER_LOG_PATH: wrangler-debug.log
        run: pnpm exec playwright test

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-node-${{ matrix.node }}-pnpm-${{ matrix.pnpm }}
          path: |
            playwright-report/
            test-results/
            wrangler-debug.log
          if-no-files-found: ignore
          retention-days: 7

  build-deploy:
    name: Build & Deploy
    needs: test-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 58ac02314ef1f46bc0027b2a13d3025b
          command: pages deploy src --project-name=home-page
