name: Build Website, Test & Deploy

on: [push]

permissions:
  contents: read

concurrency:
  group: build-test-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.20.0

jobs:
  test:
    name: Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        timeout-minutes: 5
        env:
          WRANGLER_LOG: debug
          WRANGLER_LOG_PATH: wrangler-debug.log
        run: pnpm exec playwright test

      # Archive the full verified site, preserving _headers and file metadata.
      - name: Package verified site
        run: tar -cf "${{ runner.temp }}/verified-site.tar" src

      - name: Upload verified site
        uses: actions/upload-artifact@v7
        with:
          name: verified-site
          path: ${{ runner.temp }}/verified-site.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
            wrangler-debug.log
          if-no-files-found: ignore
          retention-days: 7

  build-deploy:
    name: Deploy Verified Site
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified site
        uses: actions/download-artifact@v8
        with:
          name: verified-site
          path: ${{ runner.temp }}

      # Replace checkout files; never rebuild or merge unverified assets.
      - name: Restore verified site
        run: |
          rm -rf src
          tar -xf "${{ runner.temp }}/verified-site.tar"

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 58ac02314ef1f46bc0027b2a13d3025b
          command: pages deploy src --project-name=home-page
